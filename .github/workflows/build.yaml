name: Build do Target

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Compilar Target Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Aplicação
        run: npm run build

      - name: Salvar Artefato Estático (dist)
        uses: actions/upload-artifact@v4
        with:
          name: skadi_frontend
          path: dist/